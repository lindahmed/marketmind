name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: marketmind
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: marketmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketmind -d marketmind_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://marketmind:ci-only-password@localhost:5432/marketmind_test
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://marketmind:ci-only-password@localhost:5432/marketmind_test
          TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://marketmind:ci-only-password@localhost:5432/marketmind_test
          TEST_DEPLOYMENT_DATABASE_URL: postgresql+psycopg://marketmind:ci-only-password@localhost:5432/marketmind_test
      - run: docker build -t marketmind-backend .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          DEPLOYMENT_ENVIRONMENT: production
      - run: docker build -t marketmind-frontend .
  deployment-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
